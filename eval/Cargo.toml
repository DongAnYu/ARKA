[package]
name = "arka-eval"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = ["eval-package"]
eval-package = []

[[bin]]
name = "aqg_eval"
path = "src/bin/aqg_eval.rs"

[[bin]]
name = "graph_stage_a_eval"
path = "src/bin/graph_stage_a_eval.rs"

[[bin]]
name = "graph_e2e_eval"
path = "src/bin/graph_e2e_eval.rs"

[[bin]]
name = "entity_resolution_eval"
path = "src/bin/entity_resolution_eval.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
directories = "6"
chrono = { version = "0.4.45", features = ["serde"] }
rust_xlsxwriter = "0.90"
