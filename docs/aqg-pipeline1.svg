<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1360" viewBox="0 0 1120 1360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="stageA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d4d"/>
      <stop offset="1" stop-color="#1f1633"/>
    </linearGradient>
    <linearGradient id="stageB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123047"/>
      <stop offset="1" stop-color="#0e2333"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1120" height="1360" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="560" y="56" text-anchor="middle" fill="#eeeeee" font-size="30" font-weight="700" letter-spacing="-0.6">AQG Pipeline — How a Question Is Generated</text>
  <text x="560" y="86" text-anchor="middle" fill="#a3a3a3" font-size="15">MVP flow: Vault → Chunks → Stage A (key points) → Stage B (MCQs) → Save</text>

  <!-- Legend -->
  <g font-size="12.5">
    <rect x="360" y="104" width="14" height="14" rx="3" fill="url(#stageA)" stroke="#7c3aed"/>
    <text x="382" y="115" fill="#bcbcbc">Stage A (extraction)</text>
    <rect x="520" y="104" width="14" height="14" rx="3" fill="url(#stageB)" stroke="#38bdf8"/>
    <text x="542" y="115" fill="#bcbcbc">Stage B (question writing)</text>
    <rect x="720" y="104" width="14" height="14" rx="3" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="742" y="115" fill="#bcbcbc">Orchestration / IO</text>
  </g>

  <!-- Node: Choose vault -->
  <g>
    <rect x="410" y="150" width="300" height="66" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="184" text-anchor="middle" fill="#eeeeee" font-size="16" font-weight="600">Choose Markdown file / vault</text>
    <text x="560" y="204" text-anchor="middle" fill="#a3a3a3" font-size="12.5">HomePage → invoke("start_preview_generation")</text>
  </g>
  <line x1="560" y1="216" x2="560" y2="248" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Load notes -->
  <g>
    <rect x="410" y="250" width="300" height="66" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="284" text-anchor="middle" fill="#eeeeee" font-size="16" font-weight="600">Load notes</text>
    <text x="560" y="304" text-anchor="middle" fill="#a3a3a3" font-size="12.5">filesystem::load_vault_notes → Vec&lt;Note&gt;</text>
  </g>
  <line x1="560" y1="316" x2="560" y2="348" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Chunk -->
  <g>
    <rect x="410" y="350" width="300" height="72" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="382" text-anchor="middle" fill="#eeeeee" font-size="16" font-weight="600">Chunk each note</text>
    <text x="560" y="402" text-anchor="middle" fill="#a3a3a3" font-size="12.5">chunker::chunk_note → MarkdownChunk[]</text>
    <text x="560" y="416" text-anchor="middle" fill="#6b7280" font-size="11.5">split by heading/section, merge tiny sections</text>
  </g>
  <line x1="560" y1="422" x2="560" y2="456" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Per-chunk loop container -->
  <rect x="150" y="470" width="820" height="620" rx="16" fill="none" stroke="#3f3f3f" stroke-dasharray="6 6"/>
  <text x="172" y="496" fill="#8b8b8b" font-size="13" font-weight="600">For each chunk — bounded concurrency (max 3), pause / cancel aware</text>

  <!-- ChunkProcessor -->
  <g>
    <rect x="410" y="512" width="300" height="60" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="542" text-anchor="middle" fill="#eeeeee" font-size="15" font-weight="600">ChunkProcessor.process(chunk)</text>
    <text x="560" y="560" text-anchor="middle" fill="#a3a3a3" font-size="12">runs the two-stage LLM pipeline</text>
  </g>
  <line x1="560" y1="572" x2="560" y2="604" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE A -->
  <g filter="url(#glow)">
    <rect x="330" y="606" width="460" height="150" rx="14" fill="url(#stageA)" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="352" y="634" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1">STAGE A · KEY POINT EXTRACTION</text>
  <text x="352" y="660" fill="#eeeeee" font-size="14.5" font-weight="600">generate_stage_a_key_points(chunk)</text>
  <text x="352" y="682" fill="#cbb8f2" font-size="12.5">System: "extract stable, testable knowledge only"</text>
  <text x="352" y="701" fill="#cbb8f2" font-size="12.5">Ignores nav text / filler; may return empty array</text>
  <text x="352" y="720" fill="#a78bfa" font-size="12.5">Out: { key_points: [ { knowledge_point } ] }  (strict JSON)</text>
  <text x="352" y="742" fill="#8b8b8b" font-size="11.5">retry_with_backoff · up to 3 attempts · schema validated</text>

  <!-- Decision: empty? -->
  <line x1="560" y1="756" x2="560" y2="792" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <path d="M560 792 L648 838 L560 884 L472 838 Z" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="834" text-anchor="middle" fill="#eeeeee" font-size="13" font-weight="600">key_points</text>
    <text x="560" y="852" text-anchor="middle" fill="#eeeeee" font-size="13" font-weight="600">empty?</text>
  </g>

  <!-- Yes branch -> no_content (left of decision, keeps right-side dotted arrows clear) -->
  <line x1="472" y1="838" x2="308" y2="838" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="390" y="828" text-anchor="middle" fill="#9ca3af" font-size="12">yes</text>
  <g>
    <rect x="176" y="808" width="132" height="60" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="242" y="836" text-anchor="middle" fill="#facc15" font-size="13" font-weight="600">status:</text>
    <text x="242" y="854" text-anchor="middle" fill="#facc15" font-size="13" font-weight="600">no_content</text>
  </g>

  <!-- No branch -> Stage B -->
  <line x1="560" y1="884" x2="560" y2="916" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="576" y="906" fill="#9ca3af" font-size="12">no</text>

  <!-- STAGE B -->
  <g filter="url(#glow)">
    <rect x="330" y="918" width="460" height="150" rx="14" fill="url(#stageB)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="352" y="946" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1">STAGE B · MCQ GENERATION</text>
  <text x="352" y="972" fill="#eeeeee" font-size="14.5" font-weight="600">generate_stage_b_mcqs(chunk, key_points)</text>
  <text x="352" y="994" fill="#bfe3f6" font-size="12.5">1–4 MCQs · one concept per key point · no duplicates</text>
  <text x="352" y="1013" fill="#bfe3f6" font-size="12.5">4 options (A–D) · one correct · answers spread A/B/C/D</text>
  <text x="352" y="1032" fill="#7dd3fc" font-size="12.5">Out: { questions: [ {question, option_a..d, correct, explanation} ] }</text>
  <text x="352" y="1054" fill="#8b8b8b" font-size="11.5">retry_with_backoff · up to 3 attempts · schema validated</text>

  <!-- Down to aggregation -->
  <line x1="560" y1="1090" x2="560" y2="1122" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Aggregate -->
  <g>
    <rect x="360" y="1124" width="400" height="66" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="1156" text-anchor="middle" fill="#eeeeee" font-size="15" font-weight="600">Aggregate → GenerationSummary</text>
    <text x="560" y="1176" text-anchor="middle" fill="#a3a3a3" font-size="12">ChunkPreview[] + progress snapshot (polled by UI)</text>
  </g>
  <line x1="560" y1="1190" x2="560" y2="1222" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Save -->
  <g>
    <rect x="360" y="1224" width="400" height="72" rx="12" fill="#1e1e1e" stroke="#3f3f3f"/>
    <text x="560" y="1254" text-anchor="middle" fill="#eeeeee" font-size="15" font-weight="600">Review preview → Save to recall space</text>
    <text x="560" y="1274" text-anchor="middle" fill="#a3a3a3" font-size="12">invoke("save_generated_questions") → SQLite questions table</text>
    <text x="560" y="1288" text-anchor="middle" fill="#6b7280" font-size="11.5">SM-2 fields initialized → later scheduled in review sessions</text>
  </g>

  <!-- Side annotation: LLM provider -->
  <g>
    <rect x="812" y="606" width="132" height="150" rx="12" fill="#161616" stroke="#3f3f3f"/>
    <text x="878" y="632" text-anchor="middle" fill="#bcbcbc" font-size="12" font-weight="600">LLM provider</text>
    <text x="878" y="656" text-anchor="middle" fill="#a3a3a3" font-size="11.5">runtime config</text>
    <text x="878" y="676" text-anchor="middle" fill="#a3a3a3" font-size="11.5">or .env</text>
    <text x="878" y="702" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">OpenRouter</text>
    <text x="878" y="720" text-anchor="middle" fill="#a3a3a3" font-size="11">/ Ollama</text>
    <text x="878" y="742" text-anchor="middle" fill="#6b7280" font-size="10.5">strict JSON format</text>
  </g>
  <line x1="812" y1="681" x2="792" y2="681" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
  <line x1="812" y1="993" x2="792" y2="993" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
  <line x1="878" y1="756" x2="878" y2="993" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="560" y="1330" text-anchor="middle" fill="#6b7280" font-size="11.5">Source: services/generation.rs (ChunkProcessor) · services/llm.rs (Stage A/B) · services/chunker.rs · services/filesystem.rs</text>
</svg>
