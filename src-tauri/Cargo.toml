[package]
name = "arka"
version = "0.1.6"
description = "A local-first desktop application for AI-assisted active recall and spaced repetition."
authors = ["Dong An Yu"]
license-file = "../LICENSE"
publish = false
repository = "https://github.com/DongAnYu/ARKA"
homepage = "https://github.com/DongAnYu/ARKA"
readme = "../README.md"
keywords = ["education", "flashcards", "markdown", "spaced-repetition", "tauri"]
edition = "2021"
rust-version = "1.77.2"
autobins = false
default-run = "arka"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "arka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
eval-package = []

[[bin]]
name = "arka"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
directories = "6"
chrono = { version = "0.4.45", features = ["serde"] }
rust_xlsxwriter = "0.90"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
